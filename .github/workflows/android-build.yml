name: Build Android APK and Google Play Bundle (.aab)

on:
  push:
    branches: [ main, master ]
  pull_request:
    branches: [ main, master ]
  workflow_dispatch:

jobs:
  build-android:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: 'zulu'
          java-version: '17'

      - name: Set up Android SDK
        uses: android-actions/setup-android@v3

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: 'npm'

      - name: Install Node Dependencies
        run: |
          npm install

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'
          cache: 'pip'

      - name: Install Python Dependencies & Generate Assets
        run: |
          pip install Pillow
          python scripts/generate_icons.py

      - name: Grant Execute Permission for Gradle Wrapper
        run: |
          cd android
          if [ -f gradlew ]; then chmod +x gradlew; fi

      - name: Build Debug APK (For direct phone testing)
        run: |
          cd android
          gradle assembleDebug --stacktrace || ./gradlew assembleDebug --stacktrace

      - name: Build Android App Bundle (.aab for Google Play Store)
        run: |
          cd android
          gradle bundleRelease --stacktrace || ./gradlew bundleRelease --stacktrace

      - name: Upload Debug APK Artifact
        uses: actions/upload-artifact@v4
        with:
          name: growthforge-debug-apk
          path: android/app/build/outputs/apk/debug/app-debug.apk
          retention-days: 14

      - name: Upload Google Play Release Bundle (.aab)
        uses: actions/upload-artifact@v4
        with:
          name: growthforge-playstore-aab
          path: android/app/build/outputs/bundle/release/app-release.aab
          retention-days: 30
