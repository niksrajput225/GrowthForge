services:
  - type: web
    name: growthforge-app
    env: python
    buildCommand: "pip install -r requirements.txt && python scripts/generate_icons.py"
    startCommand: "gunicorn -c gunicorn.conf.py run:app"
    plan: free
    healthCheckPath: /health
    envVars:
      - key: FLASK_ENV
        value: production
      - key: SECRET_KEY
        generateValue: true
      - key: JWT_SECRET_KEY
        generateValue: true
      - key: DATABASE_URL
        fromDatabase:
          name: growthforge-db
          property: connectionString

databases:
  - name: growthforge-db
    plan: free
