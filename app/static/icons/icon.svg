<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512" width="512" height="512">
  <defs>
    <linearGradient id="bgGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#080c14" />
      <stop offset="100%" stop-color="#0f172a" />
    </linearGradient>
    <linearGradient id="primaryGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#06b6d4" />
      <stop offset="100%" stop-color="#3b82f6" />
    </linearGradient>
    <linearGradient id="flameGrad" x1="0%" y1="100%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#f59e0b" />
      <stop offset="50%" stop-color="#ef4444" />
      <stop offset="100%" stop-color="#fbbf24" />
    </linearGradient>
    <filter id="glow" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="16" result="blur" />
      <feComposite in="SourceGraphic" in2="blur" operator="over" />
    </filter>
  </defs>

  <!-- Background Shield Container -->
  <rect width="512" height="512" rx="110" fill="url(#bgGrad)" />
  <rect width="500" height="500" x="6" y="6" rx="104" fill="none" stroke="#06b6d4" stroke-width="4" stroke-opacity="0.3" />

  <!-- Outer Geometric Tech Ring -->
  <circle cx="256" cy="256" r="180" fill="none" stroke="url(#primaryGrad)" stroke-width="6" stroke-dasharray="8 16" stroke-opacity="0.5" />
  
  <!-- Central Anvil & Spark Flame Symbol -->
  <g filter="url(#glow)">
    <!-- Base Anvil Structure -->
    <path d="M140 330 L372 330 C352 350 340 380 340 390 L172 390 C172 380 160 350 140 330 Z" fill="url(#primaryGrad)" />
    <path d="M120 280 L392 280 C392 300 372 315 352 320 L160 320 C140 315 120 300 120 280 Z" fill="#38bdf8" />
    <polygon points="170,280 256,190 342,280" fill="#0284c7" opacity="0.4" />
    
    <!-- Radiant Ascension Flame / Lightning Spear -->
    <path d="M256 100 C270 160 320 190 300 240 C290 260 270 270 256 270 C242 270 222 260 212 240 C192 190 242 160 256 100 Z" fill="url(#flameGrad)" />
    <!-- Inner Core Spark -->
    <circle cx="256" cy="230" r="18" fill="#ffffff" opacity="0.9" />
  </g>
</svg>
